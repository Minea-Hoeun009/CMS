<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀន | Classroom Management System</title>
  
  <!-- Fonts ពី Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Moul&family=Siemreap&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { siemreap: ['Siemreap', 'sans-serif'], moul: ['Moul', 'sans-serif'] } } }
    }
  </script>

  <!-- Firebase SDK (v10.8.0 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Project Stylesheet & Custom Print/Typography Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Libraries ផ្សេងៗ -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- Library សម្រាប់ Export PDF គុណភាពខ្ពស់ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* Custom Animations & Scrollbar */
    .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }

    .header-vertical {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      padding: 8px 2px;
      margin: auto;
      height: 115px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    /* Global Mobile Scrolling & Custom Scrollbar */
    .custom-scrollbar {
        -webkit-overflow-scrolling: touch; 
        scrollbar-width: thin;
    }

    .table-responsive-wrapper {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        touch-action: pan-x;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-siemreap overflow-hidden dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300">
  
    <!-- ========================================== -->
    <!-- ផ្ទាំងទ្វារធំ (Dynamic Landing Screen) -->
    <!-- ========================================== -->
    <div id="landing-screen" class="fixed inset-0 z-[9000] flex items-center justify-center bg-slate-50 dark:bg-slate-900 font-siemreap overflow-y-auto custom-scrollbar">
        
        <!-- ផ្ទៃខាងក្រោយបែបចលនា (Animated Blobs Background) -->
        <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-indigo-400/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
        <div class="fixed top-[20%] right-[-10%] w-96 h-96 bg-emerald-400/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob" style="animation-delay: 2s;"></div>
        <div class="fixed bottom-[-20%] left-[20%] w-96 h-96 bg-pink-400/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob" style="animation-delay: 4s;"></div>

        <!-- ផ្ទាំងចូលគណនី (Login Box) -->
        <div id="authLoginBox" class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl w-full max-w-md rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white/50 dark:border-slate-700 p-8 md:p-10 text-center transform transition-all duration-500 relative m-4">
            
            <div class="w-20 h-20 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 text-white text-3xl shadow-lg shadow-indigo-200 dark:shadow-none transform rotate-3 hover:rotate-0 transition duration-300">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            
            <h2 class="font-moul text-2xl text-slate-800 dark:text-white mb-2 drop-shadow-sm">ប្រព័ន្ធគ្រប់គ្រងសាលា</h2>
            <p class="text-slate-500 dark:text-slate-400 text-[13px] mb-6 font-bold">សូមស្វាគមន៍! សូមបញ្ចូលគណនីដើម្បីបន្ត</p>

            <!-- ប្រអប់បង្ហាញកំហុស (Error Alert Box) -->
            <div id="loginError" class="hidden p-3 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-600 dark:text-rose-400 rounded-xl text-xs font-bold text-center mb-4 font-siemreap"></div>

            <form onsubmit="window.handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">ឈ្មោះគណនី ឬ លេខសម្គាល់គ្រូ</label>
                    <div class="relative group">
                        <i class="fa-regular fa-user absolute left-4 top-3.5 text-slate-400 text-sm group-focus-within:text-indigo-600 transition-colors duration-300"></i>
                        <input type="text" id="usernameOrPhone" required placeholder="ឧ. admin ឬ TCH-001" class="w-full pl-11 pr-4 py-3 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-2xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider">លេខសម្ងាត់</label>
                    <div class="relative group">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm group-focus-within:text-indigo-600 transition-colors duration-300"></i>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-11 py-3 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-2xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner">
                        <button type="button" onclick="window.togglePasswordVisibility('password', 'eyeIconLogin')" class="absolute right-4 top-3.5 text-slate-400 hover:text-indigo-600 transition outline-none"><i id="eyeIconLogin" class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold py-3.5 rounded-2xl transition-all shadow-xl shadow-indigo-200 dark:shadow-none transform hover:-translate-y-1 mt-6 flex items-center justify-center gap-2 outline-none text-[15px]">
                    <i class="fa-solid fa-right-to-bracket"></i> ចូលប្រព័ន្ធ
                </button>
            </form>
            <!-- បន្ទាត់ខណ្ឌ (Divider) -->
            <div class="relative my-5 flex items-center justify-center">
                <div class="border-t border-slate-200 dark:border-slate-700 w-full"></div>
                <span class="bg-white/95 dark:bg-slate-800/95 px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider relative font-siemreap">ឬចូលតាមរយៈ</span>
            </div>

            <!-- ប៊ូតុងចូលតាម Google (Gmail) & Telegram -->
            <div class="grid grid-cols-2 gap-3">
                <!-- Google / Gmail -->
                <button type="button" id="btnGoogleLogin" onclick="window.handleGoogleLogin()" class="flex items-center justify-center gap-2 py-3 px-3 bg-white dark:bg-slate-700/80 border border-slate-200 dark:border-slate-600 hover:border-red-400 hover:bg-red-50/40 dark:hover:bg-slate-600 rounded-2xl font-bold text-xs text-slate-700 dark:text-white transition-all shadow-sm hover:shadow group outline-none font-siemreap">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Google (Gmail)</span>
                </button>

                <!-- Telegram -->
                <button type="button" id="btnTelegramLogin" onclick="window.handleTelegramLogin()" class="flex items-center justify-center gap-2 py-3 px-3 bg-white dark:bg-slate-700/80 border border-slate-200 dark:border-slate-600 hover:border-sky-400 hover:bg-sky-50/40 dark:hover:bg-slate-600 rounded-2xl font-bold text-xs text-slate-700 dark:text-white transition-all shadow-sm hover:shadow group outline-none font-siemreap">
                    <i class="fa-brands fa-telegram text-[#229ED9] text-base group-hover:scale-110 transition-transform"></i>
                    <span>Telegram</span>
                </button>
            </div>


            <p class="text-center text-[13px] text-slate-500 dark:text-slate-400 mt-6 font-bold">
                មិនទាន់មានគណនីមែនទេ? 
                <button onclick="window.toggleAuthBox('register')" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-800 transition outline-none ml-1 font-bold underline">
                    ចុះឈ្មោះថ្មី
                </button>
            </p>
        </div>

        <!-- ផ្ទាំងចុះឈ្មោះ (Register Box) -->
        <div id="authRegisterBox" class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-xl w-full max-w-md rounded-[2.5rem] shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-white/50 dark:border-slate-700 p-8 md:p-10 text-center transform transition-all duration-500 relative m-4 hidden">
            
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-[1.2rem] flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-lg shadow-emerald-200 dark:shadow-none transform -rotate-3 hover:rotate-0 transition duration-300">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            
            <h2 class="font-moul text-xl text-slate-800 dark:text-white mb-1">បង្កើតគណនីថ្មី</h2>
            <p class="text-slate-500 dark:text-slate-400 text-[12px] mb-5 font-bold">សុវត្ថិភាពទិន្នន័យជារឿងចម្បងរបស់យើង</p>

            <form onsubmit="window.handleRegister(event)" class="space-y-3.5 text-left">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">ឈ្មោះ និងនាមត្រកូល *</label>
                    <div class="relative group">
                        <i class="fa-regular fa-id-card absolute left-4 top-3 text-slate-400 text-sm group-focus-within:text-emerald-500 transition-colors"></i>
                        <input type="text" id="regFullName" required placeholder="ឧ. សុខ សាន្ត" class="w-full pl-10 pr-4 py-2.5 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner font-moul">
                    </div>
                </div>
                
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">ឈ្មោះគណនី (Username) *</label>
                    <div class="relative group">
                        <i class="fa-regular fa-user absolute left-4 top-3 text-slate-400 text-sm group-focus-within:text-emerald-500 transition-colors"></i>
                        <input type="text" id="regUsername" required placeholder="ឧ. soksan" class="w-full pl-10 pr-4 py-2.5 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner lowercase">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">លេខទូរស័ព្ទ ឬ អ៊ីមែល *</label>
                    <div class="relative group">
                        <i class="fa-solid fa-phone absolute left-4 top-3 text-slate-400 text-sm group-focus-within:text-emerald-500 transition-colors"></i>
                        <input type="text" id="regContact" required placeholder="ឧ. 012345678" class="w-full pl-10 pr-4 py-2.5 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">លេខសម្ងាត់ (Password) *</label>
                    <div class="relative group">
                        <i class="fa-solid fa-lock absolute left-4 top-3 text-slate-400 text-sm group-focus-within:text-emerald-500 transition-colors"></i>
                        <input type="password" id="regPassword" required minlength="8" placeholder="យ៉ាងតិច ៨ តួអក្សរ" class="w-full pl-10 pr-10 py-2.5 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner" oninput="window.checkPasswordStrength(this.value)">
                        <button type="button" onclick="window.togglePasswordVisibility('regPassword', 'eyeIcon1')" class="absolute right-4 top-3 text-slate-400 hover:text-emerald-600 transition outline-none"><i id="eyeIcon1" class="fa-regular fa-eye"></i></button>
                    </div>
                    <!-- របារសុវត្ថិភាពលេខសម្ងាត់ -->
                    <div class="mt-2 flex gap-1 h-1.5 w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                        <div id="strBar1" class="h-full w-1/3 bg-slate-200 dark:bg-slate-600 transition-all duration-300"></div>
                        <div id="strBar2" class="h-full w-1/3 bg-slate-200 dark:bg-slate-600 transition-all duration-300"></div>
                        <div id="strBar3" class="h-full w-1/3 bg-slate-200 dark:bg-slate-600 transition-all duration-300"></div>
                    </div>
                    <p id="strText" class="text-[9px] text-slate-400 mt-1 font-bold">កម្រិតសុវត្ថិភាព: មិនទាន់មាន</p>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">បញ្ជាក់លេខសម្ងាត់ *</label>
                    <div class="relative group">
                        <i class="fa-solid fa-shield-halved absolute left-4 top-3 text-slate-400 text-sm group-focus-within:text-emerald-500 transition-colors"></i>
                        <input type="password" id="regConfirmPassword" required minlength="8" placeholder="វាយលេខសម្ងាត់ម្ដងទៀត" class="w-full pl-10 pr-10 py-2.5 bg-slate-50/50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-bold text-slate-700 dark:text-white outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 focus:bg-white dark:focus:bg-slate-700 transition-all shadow-inner">
                        <button type="button" onclick="window.togglePasswordVisibility('regConfirmPassword', 'eyeIcon2')" class="absolute right-4 top-3 text-slate-400 hover:text-emerald-600 transition outline-none"><i id="eyeIcon2" class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <div class="flex items-start gap-2.5 mt-2 p-2.5 bg-emerald-50/50 dark:bg-emerald-950/30 rounded-xl border border-emerald-100 dark:border-emerald-900">
                    <input type="checkbox" id="regTerms" required class="mt-0.5 border-slate-300 text-emerald-600 rounded focus:ring-emerald-500 cursor-pointer w-4 h-4">
                    <label for="regTerms" class="text-[10px] md:text-[11px] text-slate-600 dark:text-slate-300 leading-relaxed cursor-pointer font-bold">ខ្ញុំយល់ព្រមតាម <span class="text-emerald-600 dark:text-emerald-400">លក្ខខណ្ឌប្រើប្រាស់</span> និងរក្សាការសម្ងាត់ទិន្នន័យសិស្ស។</label>
                </div>

                <button type="submit" id="btnRegister" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3.5 rounded-2xl transition-all shadow-xl shadow-emerald-200 dark:shadow-none transform hover:-translate-y-1 mt-4 flex items-center justify-center gap-2 outline-none text-[14px]">
                    <i class="fa-solid fa-user-plus"></i> បង្កើតគណនីឥឡូវនេះ
                </button>
            </form>
            <!-- បន្ទាត់ខណ្ឌ (Divider) -->
            <div class="relative my-5 flex items-center justify-center">
                <div class="border-t border-slate-200 dark:border-slate-700 w-full"></div>
                <span class="bg-white/95 dark:bg-slate-800/95 px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider relative font-siemreap">ឬចូលតាមរយៈ</span>
            </div>

            <!-- ប៊ូតុងចូលតាម Google (Gmail) & Telegram -->
            <div class="grid grid-cols-2 gap-3">
                <!-- Google / Gmail -->
                <button type="button" id="btnGoogleLogin" onclick="window.handleGoogleLogin()" class="flex items-center justify-center gap-2 py-3 px-3 bg-white dark:bg-slate-700/80 border border-slate-200 dark:border-slate-600 hover:border-red-400 hover:bg-red-50/40 dark:hover:bg-slate-600 rounded-2xl font-bold text-xs text-slate-700 dark:text-white transition-all shadow-sm hover:shadow group outline-none font-siemreap">
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Google (Gmail)</span>
                </button>

  <script>
    // មុខងារប្តូរផ្ទាំងការងារ (View Switcher)
    window.switchView = function(viewName) {
        // 🔒 AUTH-04: រារាំងការចូលប្រើទំព័រការពារដោយគ្មានការផ្ទៀងផ្ទាត់ (Protected Route Guard)
        const isLoggedIn = (window.AppAuth && window.AppAuth.state && window.AppAuth.state.isLoggedIn) || 
                           !!localStorage.getItem('auth_teacher_id');
        if (!isLoggedIn) {
            console.warn("🔒 មិនទាន់ចូលគណនីទេ! សូមចូលប្រព័ន្ធជាមុនសិន។");
            if (window.AppAuth && typeof window.AppAuth.showAuthScreen === 'function') {
                window.AppAuth.showAuthScreen();
            }
            return;
        }

        // ការពារសិទ្ធិចូលមើលតាមតួនាទី (Admin vs Class Teacher)
        const isSchoolOrSysAdmin = typeof window.isSchoolAdmin === 'function' ? window.isSchoolAdmin() : false;
        const adminOnlyViews = ['analytics', 'timetable-homework', 'rankings'];
        if (viewName === 'tracking-book') {
            viewName = 'dashboard';
        } else if (!isSchoolOrSysAdmin && adminOnlyViews.includes(viewName)) {
            if (typeof window.showToast === 'function') {
                window.showToast("⚠️ មុខងារនេះសម្រាប់តែ Admin ប៉ុណ្ណោះ!", true);
            }
            viewName = 'dashboard';
        }

        if (typeof window.applyRoleBasedNavigation === 'function') {
            window.applyRoleBasedNavigation();
        }

        localStorage.setItem('activeMenu', viewName);

        document.querySelectorAll("main[id$='View']").forEach(el => {
            el.classList.add('hidden');
            el.classList.remove('flex', 'flex-col');
        });

        const targetView = document.getElementById(viewName + 'View');
        if (targetView) {
            targetView.classList.remove('hidden');
            targetView.classList.add('flex', 'flex-col');
        }

        // Active state លើ Desktop Sidebar
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('sidebar-btn-active', 'bg-white/10', 'text-white', 'border-l-4', 'border-indigo-400');
        });
        const activeNav = document.getElementById(`nav-${viewName}`);
        if (activeNav) {
            activeNav.classList.add('sidebar-btn-active');
        }

        // Active state លើ Mobile Bottom Nav
        document.querySelectorAll('#mobileBottomNav button').forEach(b => {
            b.classList.remove('text-indigo-600', 'dark:text-indigo-400', 'font-bold', 'scale-105');
            b.classList.add('text-slate-500', 'dark:text-slate-400');
        });
        const mobActive = document.getElementById(`mob-nav-${viewName}`);
        if (mobActive) {
            mobActive.classList.remove('text-slate-500', 'dark:text-slate-400');
            mobActive.classList.add('text-indigo-600', 'dark:text-indigo-400', 'font-bold', 'scale-105');
        }

        const titleMap = {
            'dashboard': 'ផ្ទាំងគ្រប់គ្រង (Dashboard)',
            'analytics': 'វិភាគសមត្ថភាពសិក្សាសិស្ស (Analytics)',
            'students': 'បញ្ជីរាយនាមសិស្ស',
            'attendance': 'ស្រង់វត្តមានសិស្ស',
            'scores': 'បញ្ចូលពិន្ទុ និងនិទ្ទេស',
            'timetable-homework': 'កាលវិភាគបង្រៀន & កិច្ចការផ្ទះ',
            'rankings': 'តារាងចំណាត់ថ្នាក់សិស្ស',
            'library': 'បណ្ណាល័យ និងទ្រព្យសកម្ម',
            'tracking-book': 'សៀវភៅតាមដានការសិក្សា',
            'settings': 'ការកំណត់ទូទៅ (Settings)',
            'reports': 'របាយការណ៍រដ្ឋបាល'
        };
        const iconMap = {
            'dashboard': 'fa-chart-pie',
            'analytics': 'fa-chart-line',
            'students': 'fa-user-graduate',
            'attendance': 'fa-clipboard-user',
            'scores': 'fa-award',
            'timetable-homework': 'fa-calendar-days',
            'rankings': 'fa-ranking-star',
            'library': 'fa-book-bookmark',
            'tracking-book': 'fa-book-open-reader',
            'settings': 'fa-sliders',
            'reports': 'fa-file-invoice'
        };

        const hd = document.getElementById("pageTitleHeader");
        if (hd) hd.innerText = titleMap[viewName] || 'ផ្ទាំងការងារ';

        const pageTitleIcon = document.getElementById("pageTitleIcon");
        if (pageTitleIcon) {
            pageTitleIcon.innerHTML = `<i class="fa-solid ${iconMap[viewName] || 'fa-folder-open'}"></i>`;
        }
        
        // Dispatch ទៅ Function របស់ Module នីមួយៗ
        if (viewName === 'dashboard' && typeof window.loadDashboard === 'function') window.loadDashboard();
        if (viewName === 'analytics' && typeof window.loadAnalyticsView === 'function') window.loadAnalyticsView();
        if (viewName === 'students' && typeof window.loadStudentsView === 'function') window.loadStudentsView();
        if (viewName === 'attendance' && typeof window.loadAttendanceView === 'function') window.loadAttendanceView();
        if (viewName === 'scores' && typeof window.loadScoresView === 'function') window.loadScoresView();
        if (viewName === 'timetable-homework' && typeof window.loadTimetableHomeworkView === 'function') window.loadTimetableHomeworkView();
        if (viewName === 'rankings' && typeof window.loadRankingsView === 'function') window.loadRankingsView();
        if (viewName === 'library' && typeof window.loadLibraryView === 'function') window.loadLibraryView();
        if (viewName === 'tracking-book' && typeof window.loadTrackingBookView === 'function') window.loadTrackingBookView();
        if (viewName === 'settings' && typeof window.loadSettingsView === 'function') window.loadSettingsView();
        if (viewName === 'reports' && typeof window.loadReportsView === 'function') window.loadReportsView();

        // បិទ mobile sidebar នៅពេលចុចរើស view
        if (window.innerWidth < 768) {
            window.toggleMobileSidebar(false);
        }
    };

    // មុខងារកំណត់ការបង្ហាញម៉ឺនុយតាមតួនាទី (Admin vs Class Teacher)
    window.applyRoleBasedNavigation = function() {
        const isSchoolOrSysAdmin = typeof window.isSchoolAdmin === 'function' ? window.isSchoolAdmin() : false;
        
        // សម្រាប់ Admin: បង្ហាញព័ត៌មានទាំងអស់
        // សម្រាប់ គ្រូតាមកម្រិតថ្នាក់: បង្ហាញតែ Dashboard, Students, Attendance, Score, Library, Reports and Settings
        const adminOnlyNavs = ['nav-analytics', 'nav-timetable-homework', 'nav-backup', 'nav-rankings'];
        adminOnlyNavs.forEach(navId => {
            const el = document.getElementById(navId);
            if (el) {
                if (isSchoolOrSysAdmin) {
                    el.classList.remove('hidden');
                } else {
                    el.classList.add('hidden');
                }
            }
        });
    };

    // បើក/បិទ Mobile Drawer Sidebar
    window.toggleMobileSidebar = function(show) {
      const sidebar = document.getElementById("appSidebar");
      const backdrop = document.getElementById("mobileSidebarBackdrop");
      if (!sidebar) return;

      const isCurrentlyOpen = !sidebar.classList.contains("-translate-x-full");
      const willOpen = typeof show === 'boolean' ? show : !isCurrentlyOpen;

      if (willOpen) {
        sidebar.classList.remove("-translate-x-full");
        sidebar.classList.add("translate-x-0");
        if (backdrop) {
          backdrop.classList.remove("hidden");
          setTimeout(() => backdrop.classList.remove("opacity-0"), 10);
        }
        document.body.classList.add("overflow-hidden");
      } else {
        sidebar.classList.add("-translate-x-full");
        sidebar.classList.remove("translate-x-0");
        if (backdrop) {
          backdrop.classList.add("opacity-0");
          setTimeout(() => backdrop.classList.add("hidden"), 300);
        }
        document.body.classList.remove("overflow-hidden");
      }
    };

    // បង្រួម/ពង្រីក Desktop Sidebar (w-64 <-> w-20)
    let isSidebarExpanded = true;
    window.toggleDesktopSidebarCollapse = function() {
      const sidebar = document.getElementById("appSidebar");
      const texts = document.querySelectorAll(".sidebar-text");
      if (!sidebar) return;

      isSidebarExpanded = !isSidebarExpanded;
      if (isSidebarExpanded) {
        sidebar.classList.remove("md:w-20");
        sidebar.classList.add("md:w-64");
        texts.forEach(el => {
          el.classList.remove("hidden");
          setTimeout(() => el.classList.remove("opacity-0"), 50);
        });
      } else {
        sidebar.classList.remove("md:w-64");
        sidebar.classList.add("md:w-20");
        texts.forEach(el => {
          el.classList.add("opacity-0");
          setTimeout(() => el.classList.add("hidden"), 300);
        });
      }
    };

    // ភាពឆបគ្នាជាសកលសម្រាប់ toggleSidebar
    window.toggleSidebar = function() {
      if (window.innerWidth < 768) {
        window.toggleMobileSidebar();
      } else {
        window.toggleDesktopSidebarCollapse();
      }
    };

    window.handleYearChange = function() {
        const year = document.getElementById("globalAcademicYear")?.value;
        if (year) {
            localStorage.setItem('selected_academic_year', year);
            if (typeof window.showToast === 'function') window.showToast(`🔄 ប្តូរទៅឆ្នាំសិក្សា៖ ${year}`);
            if (typeof window.fetchStudentsForScores === 'function') window.fetchStudentsForScores();
            if (typeof window.filterStudents === 'function') window.filterStudents();
            if (typeof window.fetchMonthlyAttendance === 'function') window.fetchMonthlyAttendance();
        }
    };

    window.showToast = function(message, isError = false) {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const toast = document.createElement("div");
      const bgColor = isError ? "bg-rose-600" : "bg-emerald-600";
      const icon = isError ? "fa-circle-exclamation" : "fa-circle-check";

      toast.className = `${bgColor} text-white px-5 py-3 rounded-xl shadow-lg animate-fade-in flex items-center gap-3 font-siemreap z-50`;
      toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-semibold">${message}</span>`;
      
      container.appendChild(toast);
      
      setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transform = "translateY(20px)";
          setTimeout(() => toast.remove(), 500);
      }, 3000);
    };

    window.toggleDarkMode = function() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      const icon = document.getElementById('darkModeIcon');
      if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    };

    // មុខងារទាញយកទិន្នន័យ (Fetch All Data)
    window.fetchAllData = async function(btnEl = null) {
      let origText = "";
      if (btnEl) {
          origText = btnEl.innerHTML;
          btnEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> កំពុងទាញយក...`;
          btnEl.disabled = true;
      }

      try {
          // ១. បើមាន Firestore ទាញពី Firestore
          if (window.db) {
              const currentYear = document.getElementById("globalAcademicYear")?.value || "2026-2027";
              const currentTeacherId = localStorage.getItem('auth_teacher_id') || "";

              const stuSnap = await window.db.collection("students")
                  .where("academic_year", "==", currentYear)
                  .get();

              if (!stuSnap.empty) {
                  const stuList = [];
                  stuSnap.forEach(d => stuList.push({ id: d.id, ...d.data() }));
                  window.allStudents = stuList;
                  localStorage.setItem('academic_students', JSON.stringify(stuList));
              }
          } else if (typeof window.apiGet === 'function') {
              // ២. បើគ្មាន Firestore ទាញតាម Legacy API
              const res = await window.apiGet("getStudents", { status: "Active" });
              if (res && res.status === "success" && res.data) {
                  window.allStudents = res.data;
                  localStorage.setItem('academic_students', JSON.stringify(res.data));
              }
          }

          if (typeof window.showToast === 'function') window.showToast("🔄 ទាញយកទិន្នន័យបានជោគជ័យ!");

          // Refresh UI
          const activeMenu = localStorage.getItem('activeMenu') || 'dashboard';
          if (activeMenu === 'students' && typeof window.filterStudents === 'function') window.filterStudents();
          if (activeMenu === 'dashboard' && typeof window.loadDashboard === 'function') window.loadDashboard();
          if (activeMenu === 'scores' && typeof window.fetchStudentsForScores === 'function') window.fetchStudentsForScores();

      } catch (err) {
          console.warn("Fetch data error:", err);
          if (typeof window.showToast === 'function') window.showToast("បរាជ័យក្នុងការទាញយកទិន្នន័យ!", true);
      } finally {
          if (btnEl) {
              btnEl.innerHTML = origText;
              btnEl.disabled = false;
          }
      }
    };
  </script>
